[package]
name = "nullang"
version = "0.1.0"
edition = "2021"
description = "Nullang — native construction language for NullVoidOS (v0.1 closed-loop)"
license = "MIT"

[lib]
name = "nullang"
path = "src/lib.rs"

[[bin]]
name = "nullang"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
