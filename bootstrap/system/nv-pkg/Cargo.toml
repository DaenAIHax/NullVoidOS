[package]
name = "nv-pkg"
version = "0.1.0"
edition = "2021"
description = "NullVoidOS package manager — local store only, no network"
authors = ["NullVoidOS contributors"]

[[bin]]
name = "nv-pkg"
path = "src/main.rs"

[lib]
name = "nv_pkg"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
walkdir = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
